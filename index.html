       ============================================================================ */
    async function teacherLogin() {
        const username = document.getElementById('teacherLoginUsername').value.trim();
        const password = document.getElementById('teacherLoginPassword').value.trim();

        if (!username) { showToast('⚠️ Please enter your username', true); return; }
        if (!password) { showToast('⚠️ Please enter your password', true); return; }
        if (!supabaseClient || !isConnected) { showToast('⚠️ Database not connected', true); return; }

        const loginBtn = document.querySelector('#teacherLoginForm .btn-submit');
        loginBtn.disabled = true;
        loginBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Checking...';

        try {
            const { data: teacher, error } = await supabaseClient
                .from('teachers').select('*').eq('username', username).maybeSingle();

            if (error) throw error;

            if (!teacher) {
                const { data: allTeachers } = await supabaseClient.from('teachers').select('username');
                const list = (allTeachers && allTeachers.length) ? allTeachers.map(t => t.username).join(', ') : 'none found';
                showToast('❌ Teacher not found. Available: ' + list, true);
                return;
            }

            const hashedInput = await hashPassword(password);
            let passwordOk = false;

            if (teacher.password_hash) {
                passwordOk = (teacher.password_hash === hashedInput);
            } else if (teacher.password) {
                passwordOk = (teacher.password === password);
                if (passwordOk) {
                    // upgrade legacy plaintext to hash
                    supabaseClient.from('teachers').update({ password_hash: hashedInput }).eq('id', teacher.id)
                        .then(() => {}).catch(() => {});
                }
            }

            if (!passwordOk) { showToast('❌ Invalid password. Please try again.', true); return; }

            currentUser = { role: 'teacher', id: teacher.id, name: teacher.name };
            showToast('✅ Logged in as teacher: ' + teacher.name);
            loginModal.classList.remove('active');
            updateLoginUI();
            teacherLocked.style.display = 'none';
            teacherContent.style.display = 'block';
            document.querySelector('.tab-btn[data-tab="teacher"]').click();
            teacherNameDisplay.textContent = 'Welcome, ' + teacher.name;

        } catch (err) {
            console.error('❌ Login error:', err);
            showToast('❌ Error: ' + err.message, true);
        } finally {
            loginBtn.disabled = false;
            loginBtn.innerHTML = '<i class="fas fa-sign-in-alt"></i> Sign In';
        }
    }
    window.teacherLogin = teacherLogin;

    /* ============================================================================
       FIXED: hashPassword previously used only `crypto.subtle`, which is
       `undefined` on plain HTTP origins (non-secure contexts). Login then threw
       and could never succeed. Now falls back to a pure-JS SHA-256.
       ============================================================================ */
    function sha256Fallback(ascii) {
        function rr(v, a) { return (v >>> a) | (v << (32 - a)); }
        const mp = Math.pow;
        const maxWord = mp(2, 32);
        let result = '';
        const words = [];
        const asciiBitLength = ascii.length * 8;

        const hash = sha256Fallback.h = sha256Fallback.h || [];
        const k    = sha256Fallback.k = sha256Fallback.k || [];
        let primeCounter = k.length;

        const isComposite = {};
        for (let candidate = 2; primeCounter < 64; candidate++) {
            if (!isComposite[candidate]) {
                for (let i = 0; i < 313; i += candidate) isComposite[i] = candidate;
                hash[primeCounter] = (mp(candidate, 0.5) * maxWord) | 0;
                k[primeCounter++] = (mp(candidate, 1/3) * maxWord) | 0;
            }
        }

        ascii += '\x80';
        while (ascii.length % 64 - 56) ascii += '\x00';
        for (let i = 0; i < ascii.length; i++) {
            const j = ascii.charCodeAt(i);
            if (j >> 8) return '';
            words[i >> 2] |= j << ((3 - i) % 4) * 8;
        }
        words[words.length] = (asciiBitLength / maxWord) | 0;
        words[words.length] = asciiBitLength;

        for (let j = 0; j < words.length;) {
            const w = words.slice(j, j += 16);
            const oldHash = hash.slice(0);
            hash.length = 8;
            for (let i = 0; i < 64; i++) {
                const w15 = w[i - 15], w2 = w[i - 2];
                const a = hash[0], e = hash[4];
                const temp1 = hash[7]
                    + (rr(e,6) ^ rr(e,11) ^ rr(e,25))
                    + ((e & hash[5]) ^ ((~e) & hash[6]))
                    + k[i]
                    + (w[i] = (i < 16) ? w[i] : (
                        w[i-16]
                        + (rr(w15,7) ^ rr(w15,18) ^ (w15 >>> 3))
                        + w[i-7]
                        + (rr(w2,17) ^ rr(w2,19) ^ (w2 >>> 10))
                    ) | 0);
                const temp2 = (rr(a,2) ^ rr(a,13) ^ rr(a,22))
                    + ((a & hash[1]) ^ (a & hash[2]) ^ (hash[1] & hash[2]));
                hash.unshift((temp1 + temp2) | 0);
                hash[4] = (hash[4] + temp1) | 0;
                hash.length = 8;
            }
            for (let i = 0; i < 8; i++) hash[i] = (hash[i] + oldHash[i]) | 0;
        }

        for (let i = 0; i < 8; i++) {
            for (let j = 3; j + 1; j--) {
                const b = (hash[i] >> (j * 8)) & 255;
                result += ((b < 16) ? 0 : '') + b.toString(16);
            }
        }
        return result;
    }

    async function hashPassword(password) {
        if (window.crypto && window.crypto.subtle && window.isSecureContext) {
            try {
                const data = new TextEncoder().encode(password);
                const hash = await crypto.subtle.digest('SHA-256', data);
                return Array.from(new Uint8Array(hash)).map(b => b.toString(16).padStart(2,'0')).join('');
            } catch (e) {
                console.warn('crypto.subtle failed, using JS fallback', e);
            }
        }
        return sha256Fallback(password);
    }

    /* ============================================================================
       NEW: Load classes from the DB once, cache them, and populate every
       class-related dropdown from that cache. This replaces the old
       behaviour of populating dropdowns from the hardcoded CLASS_DEFINITIONS
       — which produced string IDs that the DB (integer PK) rejected.
       ============================================================================ */
    async function loadClassesIntoCache() {
        if (!supabaseClient || !isConnected) return;
        try {
            const { data, error } = await supabaseClient.from('classes')
                .select('id, grade, stream, display_name').order('grade', { ascending: true });
            if (error) throw error;
            CLASS_CACHE = {};
            CLASS_LIST = [];
            (data || []).forEach(c => {
                const display = c.display_name || ((c.grade || '') + ' ' + (c.stream || '')).trim();
                CLASS_CACHE[String(c.id)] = display;
                CLASS_LIST.push({ id: c.id, grade: c.grade, stream: c.stream, display });
            });
        } catch (e) {
            console.error('Error loading class cache:', e);
        }
    }

    function getClassDisplay(classId) {
        if (classId === null || classId === undefined || classId === '') return 'N/A';
        const key = String(classId);
        if (CLASS_CACHE[key]) return CLASS_CACHE[key];
        // Legacy fallback for rows stored with old string IDs
        const legacy = CLASS_DEFINITIONS.find(c => String(c.id) === key);
        return legacy ? legacy.display : key;
    }

    /* ============================================================================
       Dropdown population — all now driven by CLASS_LIST (from DB), not the
       hardcoded CLASS_DEFINITIONS.
       ============================================================================ */
    function fillClassDropdown(drop, firstOption) {
        if (!drop) return;
        drop.innerHTML = `<option value="">${firstOption || 'Select Class'}</option>`;
        CLASS_LIST.forEach(c => {
            const o = document.createElement('option');
            o.value = String(c.id);
            o.textContent = c.display;
            drop.appendChild(o);
        });
    }

    function initSupabase() {
        try {
            const savedSchool = localStorage.getItem('selectedSchool');
            if (savedSchool && SCHOOL_CONFIG.schools[savedSchool]) currentSchoolCode = savedSchool;
            applySchoolBranding();

            if (typeof window.supabase === 'undefined' || !window.supabase.createClient) {
                setConnectionStatus('offline', 'Error');
                showToast('⚠️ Supabase library not loaded. Please refresh.', true);
                return;
            }

            supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
                auth: { persistSession:false, autoRefreshToken:false, detectSessionInUrl:false }
            });

            supabaseClient.from('students').select('id', { count:'exact', head:true })
                .then(({ data, error }) => {
                    if (error) {
                        setConnectionStatus('offline', 'Error');
                        showToast('❌ Database connection failed: ' + error.message, true);
                        console.error('Connection error:', error);
                        return;
                    }
                    isConnected = true;
                    setConnectionStatus('online', 'Connected');
                    showToast('✅ Database connected');
                    loadAllData();
                })
                .catch(err => {
                    setConnectionStatus('offline', 'Error');
                    showToast('❌ Cannot connect to database: ' + err.message, true);
                    console.error('Connection error:', err);
                });
        } catch (e) {
            setConnectionStatus('offline', 'Error');
            showToast('❌ Initialization error: ' + e.message, true);
            console.error('Init error:', e);
        }
    }

    function displayResultsEntryWithScores(students, subject, term, year, testType, resultsMap) {
        let html = '';
        students.forEach((s, i) => {
            const existing = resultsMap ? resultsMap[s.id] : null;
            const score = existing ? existing.score : '';
            const comment = existing ? existing.comment || '' : '';
            const grade = score ? getGrade(parseInt(score)) : '-';
            const gradeClass = score ? getGradeClass(parseInt(score)) : '';
            html += `<tr data-student-id="${s.id}">
                <td>${i+1}</td>
                <td><strong>${s.name}</strong></td>
                <td>${s.student_number}</td>

                <td class="grade-display ${gradeClass}" style="text-align:center;">${grade}</td>
                <td><input type="text" class="comment-input" value="${comment}" placeholder="Comment..." style="width:100%;padding:6px 8px;border-radius:8px;border:1.5px solid var(--border);font-size:12px;"></td>

        });

                    gradeCell.textContent = getGrade(val);
                    gradeCell.className = 'grade-display ' + getGradeClass(val);
                } else {
                    gradeCell.textContent = '-';
                    gradeCell.className = 'grade-display';
                }
            });

    function getGrade(score) {
        if (score >= 80) return 'A';
        if (score >= 70) return 'B';
        if (score >= 60) return 'C';
        if (score >= 50) return 'D';
        return 'E';
    }
    function getGradeClass(score) {
        if (score >= 80) return 'badge-success';
        if (score >= 70) return 'badge-info';
        if (score >= 60) return 'badge-warning';
        if (score >= 50) return 'badge-purple';
        return 'badge-danger';
    }
    function escapeHtml(str) {
        return String(str ?? '').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
    }

    async function findStudentByNumber(rawInput) {
        if (!rawInput) return { student: null, error: null };
        const base = String(rawInput).trim();
        const candidates = new Set();
        candidates.add(base);
        candidates.add(base.replace(/\s+/g, ''));
        candidates.add(base.replace(/\s*-\s*/g, '-'));
        candidates.add(base.replace(/[-\s]+/g, ''));
        const digitsOnly = base.replace(/\D/g, '');
        if (digitsOnly.length >= 6) {
            const year = digitsOnly.slice(0, 4);
            const rest = digitsOnly.slice(4);
            candidates.add(`${year}-${rest}`);
            candidates.add(`${year}${rest}`);
            candidates.add(`${year}/${rest}`);
        }
        const candidateList = [...candidates].filter(Boolean);
        let lastError = null;

        for (const candidate of candidateList) {
            const { data, error } = await supabaseClient.from('students').select('*').eq('student_number', candidate).maybeSingle();
            if (error) { lastError = error; continue; }
            if (data) return { student: data, error: null };
        }
        try {
            const safe = base.replace(/[%_]/g, '');
            const { data: likeData, error: likeErr } = await supabaseClient
                .from('students').select('*').ilike('student_number', `%${safe}%`).limit(5);
            if (likeErr) lastError = likeErr;
            else if (likeData && likeData.length === 1) return { student: likeData[0], error: null };
            else if (likeData && likeData.length > 1) {
                return { student: null, error: new Error('Multiple students match "' + base + '": ' +
                    likeData.map(s => s.student_number + ' (' + s.name + ')').join(', ')) };
            }
        } catch (e) { lastError = e; }
        return { student: null, error: lastError };
    }

    async function generateAnalysisReport() {
        if (!currentUser || currentUser.role !== 'admin') { showToast('🔒 Admin login required', true); return; }

        const classId  = analysisClassSelect.value;
        const subject  = analysisSubjectSelect.value;
        const term     = analysisTermSelect.value;
        const year     = analysisYearSelect.value;
        const testType = analysisTestTypeSelect.value;

        if (!term || !year || !testType) { showToast('⚠️ Please select term, year and test type', true); return; }
        if (!supabaseClient || !isConnected) { showToast('⚠️ Database not connected', true); return; }

        try {
            showToast('🔄 Generating analysis...');
            let sQ = supabaseClient.from('students').select('id, name, student_number, class');
            if (classId) sQ = sQ.eq('class', String(classId));
            const { data: students, error: sErr } = await sQ;
            if (sErr) throw sErr;

            if (!students || students.length === 0) {
                showToast('⚠️ No students found for this selection', true);
                analysisResultsArea.style.display = 'none';
                return;
            }

            const studentIds = students.map(s => s.id);
            let rQ = supabaseClient.from('results')
                .select('student_id, subject, score, test_type')
                .in('student_id', studentIds).eq('term', term).eq('year', year);
            if (subject) rQ = rQ.eq('subject', subject);
            if (testType !== 'combined') rQ = rQ.eq('test_type', testType);

            const { data: results, error: rErr } = await rQ;
            if (rErr) throw rErr;

            const studentMap = {};
            students.forEach(s => { studentMap[s.id] = { ...s, subjects: {} }; });
            (results || []).forEach(r => {
                const rec = studentMap[r.student_id]; if (!rec) return;
                if (!rec.subjects[r.subject]) rec.subjects[r.subject] = {};
                rec.subjects[r.subject][r.test_type] = r.score;
            });

            const rows = [];
            Object.values(studentMap).forEach(rec => {
                const subjectScores = {};
                Object.keys(rec.subjects).forEach(subj => {
                    const entry = rec.subjects[subj];
                    let resolved = null;
                    if (testType === 'combined') {
                        if (entry.mid_term != null && entry.end_term != null) resolved = Math.round((entry.mid_term + entry.end_term) / 2);
                        else if (entry.mid_term != null) resolved = entry.mid_term;
                        else if (entry.end_term != null) resolved = entry.end_term;
                    } else {
                        resolved = entry[testType] != null ? entry[testType] : null;
                    }
                    if (resolved != null) subjectScores[subj] = resolved;
                });
                const vals = Object.values(subjectScores);
                if (vals.length === 0) return;
                const avg = Math.round(vals.reduce((a,b) => a+b, 0) / vals.length);
                rows.push({ id: rec.id, name: rec.name, number: rec.student_number, classId: rec.class,
                            subjectScores, average: avg, grade: getGrade(avg) });
            });

            if (rows.length === 0) {
                showToast('⚠️ No results found for this selection', true);
                analysisResultsArea.style.display = 'none';
                return;
            }

            rows.sort((a, b) => b.average - a.average);
            rows.forEach((r, i) => r.rank = i + 1);

            const scores = rows.map(r => r.average);
            const classAverage = Math.round(scores.reduce((a,b) => a+b, 0) / scores.length);
            const highest = Math.max(...scores);
            const lowest  = Math.min(...scores);
            const passRate = Math.round((scores.filter(s => s >= 50).length / scores.length) * 100);

            const gradeCounts = { A:0, B:0, C:0, D:0, E:0 };
            rows.forEach(r => gradeCounts[r.grade]++);

            currentAnalysisData = { rows, classAverage, highest, lowest, passRate, gradeCounts, classId, subject, term, year, testType };
            renderAnalysisReport(currentAnalysisData);
            showToast(`✅ Analysis generated for ${rows.length} students`);

    function handleBulkFile(file) {
        const reader = new FileReader();
        reader.onload = function(e) {
            try {
                const data = new Uint8Array(e.target.result);
                const workbook = XLSX.read(data, { type:'array' });
                const jsonData = XLSX.utils.sheet_to_json(workbook.Sheets[workbook.SheetNames[0]]);
                if (!jsonData || jsonData.length === 0) { showToast('⚠️ No data found in file', true); return; }

                const headers = Object.keys(jsonData[0]);
                const required = ['Student Number','Name'];
                const missing = required.filter(r => !headers.some(h => h.toLowerCase() === r.toLowerCase()));
                if (missing.length > 0) { showToast(`⚠️ Missing columns: ${missing.join(', ')}`, true); return; }

                const normalized = jsonData.map(row => {
                    const nk = headers.find(h => h.toLowerCase() === 'student number');
                    const nmk = headers.find(h => h.toLowerCase() === 'name');
                    return { student_number: String(row[nk] || '').trim(), name: String(row[nmk] || '').trim() };
                }).filter(d => d.student_number && d.name);

                if (normalized.length === 0) { showToast('⚠️ No valid rows found', true); return; }
                bulkData = normalized;
                showBulkPreview(normalized);
                bulkConfirmImportBtn.style.display = 'inline-flex';
                bulkClearPreviewBtn.style.display = 'inline-flex';
                showToast(`✅ Loaded ${normalized.length} students for bulk registration`);
            } catch (err) { showToast('❌ Error reading file: ' + err.message, true); console.error(err); }
        };
        reader.readAsArrayBuffer(file);
    }

                    <p>No results found for this student in Term ${term}, ${year}.</p></div>`;
                studentResults.style.display = 'block';
                showToast('ℹ️ No results found');
                return;
            }

            const midResults = results.filter(r => r.test_type === 'mid_term');
            const endResults = results.filter(r => r.test_type === 'end_term');
            const classDisplay = getClassDisplay(student.class);

            let html = `
                <div style="margin-bottom:12px;padding:10px 14px;background:var(--marian-blue-tint);border-radius:10px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;">
                    <span style="font-weight:600;color:var(--marian-blue);"><i class="fas fa-users"></i> Class:</span>
                    <span style="font-weight:700;color:var(--marian-blue);">${escapeHtml(classDisplay)}</span>
                    <span style="color:var(--ink-faint);">|</span>
                    <span style="font-weight:600;color:var(--marian-blue);"><i class="fas fa-calendar-alt"></i> Term ${escapeHtml(term)} · ${escapeHtml(year)}</span>
                </div>
                <div style="overflow-x:auto;margin-top:8px;">
                    <table style="width:100%;border-collapse:collapse;font-size:13px;">
                        <thead><tr style="background:var(--marian-blue);color:#fff;">
                            <th style="padding:8px 12px;text-align:left;">Subject</th>
                            <th style="padding:8px 12px;text-align:center;">Mid Term</th>
                            <th style="padding:8px 12px;text-align:center;">Grade</th>
                            <th style="padding:8px 12px;text-align:center;">End Term</th>
                            <th style="padding:8px 12px;text-align:center;">Grade</th>
                            <th style="padding:8px 12px;text-align:center;">Combined</th>
                            <th style="padding:8px 12px;text-align:center;">Grade</th>
                        </tr></thead><tbody>`;

            const subjects = [...new Set(results.map(r => r.subject))].sort();
            subjects.forEach(sub => {
                const mid = midResults.find(r => r.subject === sub);
                const end = endResults.find(r => r.subject === sub);
                const midScore = mid ? mid.score : '-';
                const endScore = end ? end.score : '-';
                const midGrade = mid ? getGrade(mid.score) : '-';
                const endGrade = end ? getGrade(end.score) : '-';
                let combined = '-', combinedGrade = '-';
                if (mid && end) { combined = Math.round((mid.score + end.score) / 2); combinedGrade = getGrade(combined); }
                else if (mid) { combined = mid.score; combinedGrade = getGrade(mid.score); }
                else if (end) { combined = end.score; combinedGrade = getGrade(end.score); }

                html += `<tr style="border-bottom:1px solid var(--border);">
                    <td style="padding:8px 12px;font-weight:600;">${escapeHtml(sub)}</td>
                    <td style="padding:8px 12px;text-align:center;font-weight:600;">${midScore}</td>
                    <td style="padding:8px 12px;text-align:center;"><span class="badge ${mid ? getGradeClass(mid.score) : 'badge-info'}">${midGrade}</span></td>
                    <td style="padding:8px 12px;text-align:center;font-weight:600;">${endScore}</td>
                    <td style="padding:8px 12px;text-align:center;"><span class="badge ${end ? getGradeClass(end.score) : 'badge-info'}">${endGrade}</span></td>
                    <td style="padding:8px 12px;text-align:center;font-weight:700;background:var(--gold-tint);">${combined}</td>
                    <td style="padding:8px 12px;text-align:center;"><span class="badge ${combined !== '-' ? getGradeClass(combined) : 'badge-info'}">${combinedGrade}</span></td>
                </tr>`;
            });

            html += `</tbody></table></div>
                <div style="margin-top:12px;font-size:12px;color:var(--ink-faint);text-align:right;">
                    <i class="fas fa-print"></i> Combined Report · Term ${escapeHtml(term)} · ${escapeHtml(year)}</div>
                <div style="margin-top:8px;display:flex;gap:8px;flex-wrap:wrap;">
                    <span class="badge badge-success">A = 80-100%</span>
                    <span class="badge badge-info">B = 70-79%</span>
                    <span class="badge badge-warning">C = 60-69%</span>
                    <span class="badge badge-purple">D = 50-59%</span>
                    <span class="badge badge-danger">E = 0-49%</span>
                </div>`;

            resultsContent.innerHTML = html;
            studentResults.style.display = 'block';
            showToast('✅ Results loaded successfully');
        } catch (err) { showToast('❌ Error: ' + err.message, true); console.error(err); }
    });

    downloadResultsBtn.addEventListener('click', function() {
        const content = document.getElementById('resultsContent');
        const info = document.getElementById('studentInfo');
        if (!content || !info) return;

        const printWindow = window.open('', '_blank', 'width=800,height=600');
        if (!printWindow) { showToast('⚠️ Please allow popups for this site', true); return; }

        const school = getCurrentSchool();
        printWindow.document.write(`
            <html><head><title>Student Report</title>
            <style>
                body { font-family: 'IBM Plex Sans', sans-serif; padding: 20px; }
                .report-header { text-align: center; margin-bottom: 20px; border-bottom: 2px solid #B8862E; padding-bottom: 10px; }
                .report-header h1 { color: #1a237e; font-family: 'Fraunces', serif; }
                .report-header .motto { color: #B8862E; font-style: italic; }
                table { width: 100%; border-collapse: collapse; font-size: 12px; }
                th { background: #1a237e; color: #fff; padding: 6px 10px; text-align: left; }
                td { padding: 6px 10px; border-bottom: 1px solid #ddd; }
                .badge { display: inline-block; padding: 2px 8px; border-radius: 12px; font-size: 10px; font-weight: 600; }
                .badge-success { background: #e8f5e9; color: #2e7d32; }
                .badge-info { background: #e3f2fd; color: #0d47a1; }
                .badge-warning { background: #fff3e0; color: #e65100; }
                .badge-purple { background: #f3e5f5; color: #6a1b9a; }
                .badge-danger { background: #ffebee; color: #c62828; }
                .footer { text-align: center; margin-top: 20px; font-size: 10px; color: #8A968C; border-top: 1px solid #ddd; padding-top: 10px; }
                .student-info-box { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 16px; background: #f5f5f5; border-radius: 12px; margin-bottom: 12px; }
                .student-info-box .info-item { display: flex; flex-direction: column; gap: 2px; }
                .student-info-box .label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; color: #8A968C; font-weight: 600; }
                .student-info-box .value { font-size: 15px; color: #15201A; font-weight: 600; }
                .student-info-box .value.class-badge { display: inline-block; background: #E8EAF6; color: #1a237e; padding: 4px 12px; border-radius: 20px; font-size: 13px; font-weight: 700; width: fit-content; }
            </style></head><body>
            <div class="report-header"><h1>${school.name}</h1><div class="motto">${school.motto}</div>
                <p style="font-size:12px;color:#4B5A50;">${school.location}</p></div>
            <div>${info.innerHTML}</div>
            <div>${content.innerHTML}</div>
            <div class="footer">${school.name} · ${school.location} · Generated on ${new Date().toLocaleDateString()}</div>
            <script>window.onload = function() { window.print(); }<\/script>
            </body></html>`);
        printWindow.document.close();
    });

    /* ---------- GO ---------- */
    initSupabase();
    setupAdminTabs();

    console.log('🚀 Lukashya Secondary School App initialized');
    console.log('📚 Supabase URL:', SUPABASE_URL);
    console.log('🏫 Current School:', getCurrentSchool().name);

})();
</script>
